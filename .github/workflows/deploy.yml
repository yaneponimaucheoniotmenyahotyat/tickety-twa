# Каждый push в main собирает приложение и публикует его на GitHub Pages:
#   /      — демо-версия (без сервера);
#   /dev/  — бета для бота: та же сборка, но с сервером за туннелем (адрес — из ветки tunnel).
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Новый деплой отменяет незавершённый предыдущий
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    # Фиксированный образ: ubuntu-latest переезжает на Ubuntu 26 (окт. 2026)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build:pages
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
