<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="robots" content="noindex" />
    <title>Tickety Dev</title>
    <!--
      Постоянный адрес для кнопки бота (и Main App в BotFather).
      Тестовое приложение живёт на компьютере разработчика за туннелем localhost.run, а его адрес
      меняется. Текущий адрес scripts/tunnel-bot.mjs пишет в tunnel.json (ветка tunnel репозитория);
      здесь мы его читаем и перебрасываем туда — вместе с #tgWebAppData, чтобы вход через Telegram работал.
    -->
    <style>
      :root { color-scheme: light dark; --bg: #f2f2f7; --fg: #111; --muted: #6b6b70; --brand: #0a56d6; }
      @media (prefers-color-scheme: dark) { :root { --bg: #000; --fg: #f2f2f7; --muted: #98989f; --brand: #4d94ff; } }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--fg);
             font: 17px -apple-system, system-ui, sans-serif; text-align: center; padding: 24px; box-sizing: border-box; }
      .spin { width: 28px; height: 28px; margin: 0 auto 16px; border: 3px solid var(--brand); border-top-color: transparent;
              border-radius: 50%; animation: s 0.9s linear infinite; }
      @keyframes s { to { transform: rotate(360deg); } }
      h1 { font-size: 20px; margin: 0 0 6px; }
      p { color: var(--muted); margin: 0 0 18px; line-height: 1.4; }
      a { display: inline-block; background: var(--brand); color: #fff; text-decoration: none; padding: 12px 20px;
          border-radius: 12px; font-weight: 600; margin: 4px; }
      a.plain { background: transparent; color: var(--brand); }
      [hidden] { display: none !important; }
    </style>
  </head>
  <body>
    <main>
      <section id="loading">
        <div class="spin"></div>
        <p>Подключаемся к тестовому серверу…</p>
      </section>
      <section id="off" hidden>
        <h1>Тестовый сервер выключен</h1>
        <p id="reason">Попробуйте позже — или откройте демо-версию.</p>
        <a href="#" id="retry">Повторить</a>
        <a class="plain" href="../">Демо-версия</a>
      </section>
    </main>
    <script>
      const SOURCE = 'https://api.github.com/repos/yaneponimaucheoniotmenyahotyat/tickety-twa/contents/tunnel.json?ref=tunnel';
      const sleep = (ms) => new Promise((r) => setTimeout(r, ms));

      async function withTimeout(url, options, ms) {
        const ctrl = new AbortController();
        const timer = setTimeout(() => ctrl.abort(), ms);
        try {
          return await fetch(url, { ...options, signal: ctrl.signal, cache: 'no-store' });
        } finally {
          clearTimeout(timer);
        }
      }

      async function currentTunnel() {
        const res = await withTimeout(`${SOURCE}&t=${Date.now()}`, { headers: { Accept: 'application/vnd.github.raw+json' } }, 8000);
        if (!res.ok) throw new Error(res.status === 403 ? 'GitHub временно ограничил запросы' : `GitHub ответил ${res.status}`);
        return (await res.json()).url;
      }

      async function alive(url) {
        try {
          return (await withTimeout(`${url}/api/health`, {}, 10000)).ok;
        } catch {
          return false;
        }
      }

      // Адрес мог только что смениться — несколько попыток с паузой
      async function connect() {
        document.getElementById('loading').hidden = false;
        document.getElementById('off').hidden = true;
        let reason = 'Попробуйте позже — или откройте демо-версию.';
        for (let attempt = 0; attempt < 3; attempt++) {
          try {
            const url = await currentTunnel();
            if (url && (await alive(url))) {
              location.replace(`${url}/${location.search}${location.hash}`);
              return;
            }
            if (!url) break; // туннель остановлен — ждать нечего
          } catch (e) {
            reason = `${e.message}. Попробуйте через минуту.`;
          }
          await sleep(3000);
        }
        document.getElementById('reason').textContent = reason;
        document.getElementById('loading').hidden = true;
        document.getElementById('off').hidden = false;
      }

      document.getElementById('retry').addEventListener('click', (e) => {
        e.preventDefault();
        connect();
      });
      connect();
    </script>
  </body>
</html>
